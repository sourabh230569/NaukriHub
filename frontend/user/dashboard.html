<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — JobPortal</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="/user/dashboard.html" class="navbar__brand">Job<span>Portal</span></a>
      <div class="navbar__links" id="desktopNav">
        <a href="/user/dashboard.html" class="active">Dashboard</a>
        <a href="/user/jobs.html">Find Jobs</a>
        <a href="/user/applications.html">My Applications</a>
        <a href="#" data-logout>Log Out</a>
      </div>
      <button class="navbar__hamburger" id="hamburger" aria-label="Toggle sidebar" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="User navigation">
      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Overview</div>
        <a href="/user/dashboard.html" class="sidebar__link active" aria-current="page">Dashboard</a>

        <div class="sidebar__section-label">Jobs</div>
        <a href="/user/jobs.html" class="sidebar__link">Find Jobs</a>

        <div class="sidebar__section-label">Applications</div>
        <a href="/user/applications.html" class="sidebar__link">My Applications</a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__user-info">
          <strong id="sidebarName">Loading...</strong>
          <span id="sidebarRole">User</span>
        </div>
        <a href="#" class="sidebar__link" data-logout>Log Out</a>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="app-content" id="main-content">
      <div class="app-content__inner">

        <div class="dash-header">
          <h1>Dashboard</h1>
          <p id="dashGreeting">Welcome back.</p>
        </div>

        <!-- Stats -->
        <div class="dash-section">
          <div class="stats-grid" id="statsGrid">
            <!-- Skeleton injected by JS -->
          </div>
        </div>

        <!-- Recent applications -->
        <div class="dash-section">
          <div class="section-header">
            <h2>Recent Applications</h2>
            <a href="/user/applications.html" class="btn btn--secondary btn--sm">View All</a>
          </div>

          <div id="dashAlert" class="alert alert--hidden" role="alert" aria-live="polite"></div>

          <div class="table-wrapper">
            <table class="table" aria-label="Recent applications">
              <thead>
                <tr>
                  <th scope="col">Job</th>
                  <th scope="col">Company</th>
                  <th scope="col">Applied</th>
                  <th scope="col">Status</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody id="recentTableBody">
                <!-- Injected by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <span class="footer__copy">JobPortal &copy; 2026. Academic project.</span>
        <nav class="footer__links" aria-label="Footer navigation">
          <a href="/terms.html">Terms of Use</a>
          <a href="/privacy.html">Privacy Policy</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/user.js"></script>
  <script>
    if (!window.auth.requireUser()) { /* redirected */ }
    else { window.userPages.initDashboard(); }
  </script>
</body>
</html>
