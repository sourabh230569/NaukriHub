<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details — JobPortal Admin</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/jobs.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="/admin/dashboard.html" class="navbar__brand">Job<span>Portal</span> <small style="font-size:0.65rem;font-weight:400;color:var(--color-text-muted);margin-left:6px;">Admin</small></a>
      <div class="navbar__links">
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/create-job.html">Create Job</a>
        <a href="#" data-logout>Log Out</a>
      </div>
      <button class="navbar__hamburger" id="hamburger" aria-label="Toggle sidebar" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Overview</div>
        <a href="/admin/dashboard.html" class="sidebar__link active">Dashboard</a>
        <div class="sidebar__section-label">Jobs</div>
        <a href="/admin/create-job.html" class="sidebar__link">Create Job</a>
        <div class="sidebar__section-label">Applications</div>
        <a href="/admin/applicants.html" class="sidebar__link">All Applicants</a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__user-info">
          <strong id="sidebarName">Loading...</strong>
          <span id="sidebarRole">Admin</span>
        </div>
        <a href="#" class="sidebar__link" data-logout>Log Out</a>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="app-content" id="main-content">
      <div class="app-content__inner">

        <div style="margin-bottom:var(--space-6);">
          <a href="/admin/dashboard.html" class="btn btn--ghost btn--sm" style="padding-left:0;">&larr; Back to Dashboard</a>
        </div>

        <div id="pageAlert" class="alert alert--hidden" role="alert" aria-live="polite"></div>

        <!-- Content injected by JS -->
        <div id="jobDetailContent">
          <!-- Skeleton -->
          <div style="background:var(--color-bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-8);">
            <div style="height:28px;width:50%;background:var(--color-bg-muted);border-radius:3px;margin-bottom:12px;animation:skeleton-pulse 1.4s ease-in-out infinite;"></div>
            <div style="height:18px;width:30%;background:var(--color-bg-muted);border-radius:3px;margin-bottom:24px;animation:skeleton-pulse 1.4s ease-in-out infinite;"></div>
            <div style="height:14px;width:80%;background:var(--color-bg-muted);border-radius:3px;margin-bottom:10px;animation:skeleton-pulse 1.4s ease-in-out infinite;"></div>
            <div style="height:14px;width:70%;background:var(--color-bg-muted);border-radius:3px;animation:skeleton-pulse 1.4s ease-in-out infinite;"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <span class="footer__copy">JobPortal &copy; 2026. Academic project.</span>
        <nav class="footer__links" aria-label="Footer navigation">
          <a href="/terms.html">Terms of Use</a>
          <a href="/privacy.html">Privacy Policy</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    if (!window.auth.requireAdmin()) { /* redirected */ }
    else { window.adminPages.initJobDetails(); }
  </script>
</body>
</html>
