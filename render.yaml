# Render deployment config for the NaukriHub backend (Express + SQLite).
# This deploys ONLY the backend as a Web Service. The frontend is deployed
# separately on Vercel.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: naukrihub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # Free plan has no persistent disk, so we re-seed on every start.
    # seed.js uses INSERT OR IGNORE, so this is safe and idempotent.
    startCommand: npm run start:seeded
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      # No persistent disk on free plan; DB lives in the app folder and is
      # re-seeded on each start. Upgrade + add a disk for real persistence.
      - key: DATABASE_PATH
        value: ./database/jobportal.db
      # Set this to your Vercel frontend URL after deploying the frontend,
      # e.g. https://naukrihub.vercel.app  (comma-separated for multiple)
      - key: CORS_ORIGIN
        sync: false
